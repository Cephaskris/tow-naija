name: Build Android APK

# Runs on every change to the app, or manually from the Actions tab ("Run workflow").
# Produces Townaija-<number>.apk under Releases, ready to download on an Android phone.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check secrets are set
        working-directory: .
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::Add SUPABASE_URL and SUPABASE_ANON_KEY under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Align native module versions with the Expo SDK
        run: npx expo install --fix || true

      - name: Generate the Android project
        run: npx expo prebuild --platform android --clean --no-install
        env:
          CI: 1

      - name: Build release APK
        working-directory: app/android
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NODE_ENV: production
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> gradle.properties
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "Townaija-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Townaija-${{ github.run_number }}
          path: app/Townaija-${{ github.run_number }}.apk

      - name: Publish as a release (download link for your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Townaija build ${{ github.run_number }}
          body: |
            Install on Android: open this page on your phone, tap the .apk file, then allow "Install unknown apps" when asked.
            Commit: ${{ github.sha }}
          files: app/Townaija-${{ github.run_number }}.apk
          make_latest: true
