name: Deploy website (landing + admin)

# Publishes the landing page (/) and admin dashboard (/admin/) to GitHub Pages.
# GitHub Pages needs a public repository on the free plan. For a private repo, use Netlify instead (see README).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "admin/**"
      - "landing/**"
      - "build_site.py"
      - ".github/workflows/deploy-admin.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          APK_URL: https://github.com/${{ github.repository }}/releases/latest
          COMMISSION: ${{ vars.COMMISSION || '10' }}
          SUPPORT_PHONE: ${{ vars.SUPPORT_PHONE }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
        run: python3 build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
